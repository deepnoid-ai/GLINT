# MONAI PersistentDataset preprocessing; the cache is built on the first run.

dataset:
  use_monai: True

  monai_config:
    orientation: "IPL"
    target_spacing: [1.5, 0.75, 0.75]
    roi_size: [240, 480, 480]
    final_size: [240, 384, 384]
    hu_range: [-1000.0, 1000.0]
    normalize_range: [-1.0, 1.0]
    crop_foreground: false
    cache_root: "monai_cache/ct_res384_IPL"  # relative to dataset.data_root
