train:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  gradient_checkpointing: False
  # No unused params under frozen-probe (all trainable modules are always touched).
  ddp_find_unused_parameters: False
  gradient_checkpointing_kwargs: { "use_reentrant": False }
  dataloader_num_workers: 4
  num_train_epochs: 10
  weight_decay: 0.05
  max_grad_norm: 1.0
  eval_strategy: epoch
  eval_steps: 1
  save_steps: 1
  save_strategy: epoch
  save_total_limit: 2
  metric_for_best_model: eval_loss
  load_best_model_at_end: True
  lr_scheduler_type: cosine
  # Longer warmup to match the 5× LR bump (50 → 200).
  warmup_steps: 200
  logging_steps: 10
  label_names: ["labels"]
  report_to: none
  remove_unused_columns: False
  seed: 42
  data_seed: 42
  full_determinism: False
  ddp_timeout: 36000

model:
  model_config:
    vision_config:
      model_type: glint
      pretrained_name_or_path: Deepnoid/GLINT-CT
      arch: "vjepa2_1_vit_large_384"
      img_size: 384
      num_frames: 80
      input_modality: 3
      input_slices: 240
      patch_size: 16
      tubelet_size: 2
      in_chans: 3
      hidden_size: 1024
      # No backward through the frozen encoder, so activation checkpointing is pure overhead.
      use_activation_checkpointing: False

dataset:
  rgb_norm: True
