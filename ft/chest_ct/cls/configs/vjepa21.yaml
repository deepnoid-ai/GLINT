# Same frozen-probe optimization as glint_ct; batch size / epochs per dataset come from glint_ct_ft_cls_all.
train:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  ddp_find_unused_parameters: False
  save_steps: 1
  warmup_steps: 200

model:
  model_config:
    pretrained_dir: ${oc.env:PRETRAINED_DIR,./pretrained}
    vision_config:
      model_type: vjepa2.1
      pretrained_checkpoint: vjepa2_1/vjepa2_1_vitl_dist_vitG_384.pt
      arch: "vjepa2_1_vit_large_384"
      img_size: 384
      num_frames: 80
      input_modality: 3
      input_slices: 240
      patch_size: 16
      tubelet_size: 2
      in_chans: 3
      hidden_size: 1024
      use_activation_checkpointing: False

dataset:
  rgb_norm: True
