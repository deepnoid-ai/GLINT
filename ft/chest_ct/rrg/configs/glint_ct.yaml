train:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  label_names: ["reports"]

model:
  model_config:
    vision_config:
      model_type: glint
      pretrained_name_or_path: Deepnoid/GLINT-CT
      arch: "vjepa2_1_vit_large_384"
      input_modality: 3
      input_slices: 240
      num_channels: 3
      img_size: 384
      num_frames: 80  # 240 slices / 3 channels
      use_hierarchical: False

    report_generator_config:
      d_vf: 1024  # ViT-L hidden size
