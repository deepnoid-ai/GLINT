# CT-CLIP pretraining geometry: 1.5 x 0.75 x 0.75 mm, (240, 480, 480) input, (10, 20, 20) CTViT patches.

model:
  model_config:
    pretrained_dir: ${oc.env:PRETRAINED_DIR,./pretrained}
    vision_config:
      model_type: ct_clip
      pretrained_name_or_path: CT-CLIP/CT-CLIP_v2.pt

    decoder_config:
      model_type: unetr_noskip
      patch_size_3d: [10, 20, 20]
      embed_dim: 512
      base_channels: 32

    input_channels: 1
    input_shape: [240, 480, 480]

dataset:
  spacing: [1.5, 0.75, 0.75]
  orientation: RAS
  patch_size: [240, 480, 480]
  a_min: -1000.0
  a_max: 1000.0
  b_min: -1.0
  b_max: 1.0
