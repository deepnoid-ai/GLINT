train:
  learning_rate: 1e-4
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  gradient_checkpointing: False
  ddp_find_unused_parameters: True
  gradient_checkpointing_kwargs: { "use_reentrant": False }
  dataloader_num_workers: 4
  num_train_epochs: 20
  weight_decay: 0.05
  max_grad_norm: 1.0
  eval_strategy: epoch
  eval_steps: 1
  save_strategy: epoch
  save_total_limit: 2
  metric_for_best_model: eval_loss
  load_best_model_at_end: True
  lr_scheduler_type: cosine
  warmup_steps: 50
  logging_steps: 10
  label_names: ["labels"]
  report_to: none
  remove_unused_columns: False
  seed: 42
  data_seed: 42
  full_determinism: False
  ddp_timeout: 36000


experiment:
  project: glint_cxr_cls_ft
  name: dev
  user: debug
  output_root_dir: ${oc.env:OUTPUT_ROOT,outputs}
  early_stopping_patience: 3
  resume_from_checkpoint: False
  tags: []
  wandb_run_id: null

dataset:
  data_root: ${oc.env:DATA_ROOT,null}

  dataset_type: cxr

  train: []
  eval: []
  test: []
