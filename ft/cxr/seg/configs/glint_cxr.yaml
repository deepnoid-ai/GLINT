model:
  model_config:
    vision_config:
      model_type: glint
      pretrained_name_or_path: Deepnoid/GLINT-CXR
      img_size: 1024
      use_cls_token: False
      patch_token_start_index: 5  # strip 1 CLS + 4 register tokens (DINOv3 default)
    projection_config:
      vision_hidden_dim: 1024
      projection_hidden_dim: 1024
    decoder_config:
      in_channels: 1024
