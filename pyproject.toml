[project]
name = "glint"
version = "1.0.0"
description = "GLINT: Sparsely Gated Vision-Language Alignment for Fine-Grained Radiology Representations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "einops>=0.8.2",
    "entmax>=1.3",
    "gitpython>=3.1.40",
    "matplotlib>=3.8.0",
    "monai>=1.5.1",
    "nibabel>=5.3.2",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.12.0.88",
    "pandas>=2.0.0",
    "pillow>=11.3.0",
    "pydicom>=2.4.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.3.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.66.0",
    "transformers==4.56.1",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
ft = [
    "dynamic-network-architectures>=0.4.3",
    "f1chexbert>=0.0.2",
    "pycocoevalcap>=1.2",
    "radgraph>=0.1.18",
    "simpleitk>=2.5.3",
    "timm>=1.0.22",
    "torchmetrics>=1.8.2",
    "vector-quantize-pytorch==1.1.2",
]

[tool.uv]
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glint", "common", "ft"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
